[project]
name = "chat-with-docs"
version = "0.1.0"
description = "Ask questions about your documents with cited, grounded answers"
requires-python = ">=3.10"

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008", "B905", "E501"]  # B008: FastAPI File() defaults; E501: long prompt/SQL strings
