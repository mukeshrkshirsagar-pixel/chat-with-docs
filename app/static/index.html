<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Chat with your docs</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand"><span class="logo">&#9670;</span> Chat with your docs</div>

    <label class="drop" id="drop">
      <input type="file" id="file" multiple accept=".pdf,.txt,.md,.markdown,.docx" hidden>
      <strong>Drop files here</strong>
      <span>or click to browse &middot; PDF, DOCX, MD, TXT</span>
    </label>
    <div id="upload-status" class="upload-status" aria-live="polite"></div>

    <h2>Documents <span id="doc-count" class="pill">0</span></h2>
    <ul id="docs" class="docs"></ul>

    <div id="stats" class="stats"></div>
  </aside>

  <main class="chat">
    <div id="messages" class="messages" aria-live="polite">
      <div id="empty" class="empty">
        <h1>Ask your documents anything</h1>
        <p>Upload a document on the left, then ask a question. Answers are grounded in what you upload, with citations you can check. If the documents don't say, so will I.</p>
        <div id="suggestions" class="suggestions"></div>
      </div>
    </div>

    <form id="composer" class="composer">
      <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a question about your documents…" aria-label="Question"></textarea>
      <button id="send" class="btn primary" type="submit">Send</button>
    </form>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
